version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" does not reach composite actions; the glob covers any a fork adds.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  # The gate's own tools (ci/requirements.txt), exact-pinned.
  - package-ecosystem: "pip"
    directory: "/ci"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
      semver-major-days: 7

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    # A major changes the ":1" key, which a VS Code defaultFeatures entry for the same
    # Feature must share; move both by hand.
    ignore:
      - dependency-name: "ghcr.io/jartan-llc/enchantments/*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  # Grouped by name, not update-types: with SHA-frozen revs an update-types group splits into
  # one PR per hook (dependabot/dependabot-core#15266, open as of 2026-09-28).
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      hooks:
        patterns:
          - "*"
    cooldown:
      default-days: 7
