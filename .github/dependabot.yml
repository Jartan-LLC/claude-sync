version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" does not reach composite actions; the glob covers any under .github/actions/.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/ci"
    # Sphinx 9.2 needs Python 3.13 and .python-version is 3.12; ignored so a bump that can't
    # install never holds up the group.
    ignore:
      - dependency-name: "sphinx"
        versions: [">=9.2"]
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
      semver-major-days: 7

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  # The Fedora image the RPM jobs run in, its digest only: the fedora image tags the next
  # release's number before that release ships, so a major bump would move the jobs onto an
  # unreleased Fedora.
  - package-ecosystem: "docker"
    directory: "/packaging"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "fedora"
        update-types:
          - "version-update:semver-major"
    cooldown:
      default-days: 7

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  # Grouped by name, not update-types: with SHA-frozen revs an update-types group splits into
  # one PR per hook (dependabot/dependabot-core#15266, open as of 2026-09-28).
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      hooks:
        patterns:
          - "*"
    cooldown:
      default-days: 7
